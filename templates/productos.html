{% extends "base.html" %}
{% block title %}Productos{% endblock %}
{% block content %}
<h1>Productos</h1>
<p class="subtitulo">Alta, baja y modificación del maestro. Escaneá un código para buscar o para dar de alta.</p>

<div id="msg"></div>

<div class="panel">
  <h2 id="form-titulo">Alta de producto</h2>
  <form id="form-producto" class="form-grid">
    <input type="hidden" id="p-id">
    <div class="campo"><label>Código de barras *</label>
      <input id="p-codigo" type="text" required placeholder="Escaneá o escribí…"></div>
    <div class="campo"><label>Nombre *</label>
      <input id="p-nombre" type="text" required placeholder="Ej: Arroz Gallo 1kg"></div>
    <div class="campo"><label>Categoría</label>
      <input id="p-categoria" type="text" placeholder="Almacén, Bebidas…"></div>
    <div class="campo"><label>Precio</label>
      <input id="p-precio" type="number" step="0.01" min="0" value="0"></div>
    <div class="campo"><label>Stock actual</label>
      <input id="p-stock" type="number" min="0" value="0"></div>
    <div class="campo"><label>Stock mínimo</label>
      <input id="p-minimo" type="number" min="0" value="0"></div>
    <div class="campo"><label>Proveedor</label>
      <select id="p-proveedor"><option value="">— Sin proveedor —</option></select></div>
    <div class="campo" style="justify-content:end">
      <div class="acciones">
        <button class="btn" type="submit" id="btn-guardar">Guardar producto</button>
        <button class="btn secundario" type="button" id="btn-cancelar" hidden>Cancelar</button>
      </div>
    </div>
  </form>
</div>

<div class="panel">
  <h2>Maestro de productos</h2>
  <div class="campo" style="max-width:340px;margin-bottom:12px">
    <label>Buscar</label>
    <input id="buscar" type="text" placeholder="Nombre, código o categoría…">
  </div>
  <div id="tabla" class="sin-datos">Cargando…</div>
</div>
{% endblock %}

{% block scripts %}
<script>
const money = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });
const form = document.getElementById('form-producto');
let todos = [];

function mostrarMsg(texto, tipo) {
  const el = document.getElementById('msg');
  el.innerHTML = texto ? `<div class="mensaje ${tipo}">${texto}</div>` : '';
}

function stockClase(p) {
  if (p.stock_actual === 0) return 'sin-stock';
  if (p.stock_actual <= p.stock_minimo) return 'poco';
  return '';
}

function limpiarForm() {
  form.reset();
  document.getElementById('p-id').value = '';
  document.getElementById('form-titulo').textContent = 'Alta de producto';
  document.getElementById('btn-cancelar').hidden = true;
}

function editar(p) {
  document.getElementById('p-id').value = p.id;
  document.getElementById('p-codigo').value = p.codigo_barras;
  document.getElementById('p-nombre').value = p.nombre;
  document.getElementById('p-categoria').value = p.categoria;
  document.getElementById('p-precio').value = p.precio;
  document.getElementById('p-stock').value = p.stock_actual;
  document.getElementById('p-minimo').value = p.stock_minimo;
  document.getElementById('p-proveedor').value = p.proveedor_id || '';
  document.getElementById('form-titulo').textContent = `Editando: ${p.nombre}`;
  document.getElementById('btn-cancelar').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function cargar() {
  todos = await fetch('/api/productos').then((r) => r.json());
  pintar(document.getElementById('buscar').value);
}

function pintar(q) {
  const filtro = (q || '').toLowerCase();
  const lista = todos.filter((p) =>
    p.nombre.toLowerCase().includes(filtro) ||
    p.codigo_barras.includes(filtro) ||
    (p.categoria || '').toLowerCase().includes(filtro));
  const cont = document.getElementById('tabla');
  if (!lista.length) {
    cont.className = 'sin-datos';
    cont.textContent = 'Sin productos para esa búsqueda.';
    return;
  }
  cont.className = '';
  cont.innerHTML = `<table><thead><tr>
      <th>Producto</th><th>Código</th><th>Categoría</th>
      <th class="num">Precio</th><th class="num">Stock</th><th class="num">Mín.</th>
      <th>Proveedor</th><th></th>
    </tr></thead><tbody>` +
    lista.map((p) => `<tr>
      <td>${p.nombre}</td>
      <td style="font-family:monospace">${p.codigo_barras}</td>
      <td>${p.categoria || '—'}</td>
      <td class="num">${money.format(p.precio)}</td>
      <td class="num ${stockClase(p)}">${p.stock_actual}</td>
      <td class="num">${p.stock_minimo}</td>
      <td>${p.proveedor}</td>
      <td><div class="acciones">
        <button class="btn chico secundario" data-editar="${p.id}">Editar</button>
        <button class="btn chico peligro" data-borrar="${p.id}">Baja</button>
      </div></td>
    </tr>`).join('') + '</tbody></table>';

  cont.querySelectorAll('[data-editar]').forEach((btn) => {
    btn.addEventListener('click', () =>
      editar(todos.find((p) => p.id === Number(btn.dataset.editar))));
  });
  cont.querySelectorAll('[data-borrar]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const p = todos.find((x) => x.id === Number(btn.dataset.borrar));
      if (!confirm(`¿Dar de baja ${p.nombre}?`)) return;
      const r = await fetch(`/api/productos/${p.id}`, { method: 'DELETE' });
      const d = await r.json();
      toast(d.ok ? 'Producto dado de baja' : d.error, r.ok ? 'ok' : 'error');
      cargar();
    });
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('p-id').value;
  const cuerpo = {
    codigo_barras: document.getElementById('p-codigo').value.trim(),
    nombre: document.getElementById('p-nombre').value.trim(),
    categoria: document.getElementById('p-categoria').value.trim(),
    precio: document.getElementById('p-precio').value,
    stock_actual: document.getElementById('p-stock').value,
    stock_minimo: document.getElementById('p-minimo').value,
    proveedor_id: document.getElementById('p-proveedor').value || null,
  };
  const r = await fetch(id ? `/api/productos/${id}` : '/api/productos', {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo),
  });
  const d = await r.json();
  if (!r.ok) { mostrarMsg(d.error, 'error'); return; }
  mostrarMsg(id ? `✅ ${d.nombre} actualizado` : `✅ ${d.nombre} dado de alta`, 'ok');
  limpiarForm();
  cargar();
});

document.getElementById('btn-cancelar').addEventListener('click', limpiarForm);
document.getElementById('buscar').addEventListener('input', (e) => pintar(e.target.value));

// Escaneo en esta pantalla: busca el producto; si no existe, precarga el alta.
document.addEventListener('scan', async (e) => {
  const codigo = e.detail.codigo;
  const r = await fetch(`/api/productos/buscar?codigo=${encodeURIComponent(codigo)}`);
  if (r.ok) {
    const p = await r.json();
    document.getElementById('buscar').value = p.codigo_barras;
    pintar(p.codigo_barras);
    toast(`${p.nombre} encontrado`);
  } else {
    limpiarForm();
    document.getElementById('p-codigo').value = codigo;
    document.getElementById('p-nombre').focus();
    toast('Producto inexistente: completá el alta', 'error');
  }
  document.getElementById('scan-input').focus();
});

// Proveedores para el selector del formulario.
fetch('/api/proveedores')
  .then((r) => r.json())
  .then((provs) => {
    const sel = document.getElementById('p-proveedor');
    provs.forEach((p) => {
      const o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.nombre;
      sel.appendChild(o);
    });
  });

cargar();
</script>
{% endblock %}
